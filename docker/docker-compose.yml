#-SERVICES-
services:
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: back-end
    volumes:
      - ${GOINFRE_PATH}/db:/usr/src/database
    env_file:
      - .env
    restart:  always
    networks:
      - trance-net

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always
    networks:
      - trance-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - ${GOINFRE_PATH}/prometheus:/prometheus
    ports:
      - "9090:9090"
    env_file:
      - .env
    restart: always
    networks:
      - trance-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ${GOINFRE_PATH}/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    env_file:
      - .env
    depends_on:
      - prometheus
    restart: always
    networks:
      - trance-net    

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: always
    networks:
      - trance-net

#-NETWORKS-
networks:
  trance-net: 
    driver: bridge
    name: inception

#-VOLUMES-
volumes:
  db_data:
  grafana_data:
  prometheus_data: